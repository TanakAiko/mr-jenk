services:
  eureka-server:
    image: ${DOCKER_REGISTRY}/discovery-service:latest
    build:
      context: ./discovery-service
      dockerfile: Dockerfile
    ports:
      - "9761:9761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9761/actuator/health"]
      interval: 10s
      retries: 5
      start_period: 20s

  config-service:
    image: ${DOCKER_REGISTRY}/config-service:latest
    build:
      context: ./config-service
      dockerfile: Dockerfile
    ports:
      - "9888:9888"
    environment:
      - EUREKA_URL=http://eureka-server:9761/eureka
      - CONFIG_REPO_URI=${CONFIG_REPO_URI}
      - CONFIG_REPO_USERNAME=${CONFIG_REPO_USERNAME}
      - CONFIG_REPO_PASSWORD=${CONFIG_REPO_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9888/actuator/health"]
      interval: 10s
      retries: 5
      start_period: 20s

    depends_on:
       eureka-server:
        condition: service_healthy

  api-gateway:
    image: ${DOCKER_REGISTRY}/api-gateway:latest
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:9761/eureka
      - EUREKA_URL=http://eureka-server:9761/eureka
      - DOCKER_CONFIG_SERVICE_URL=http://config-service:9888
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8090/actuator/health"]
      interval: 10s
      retries: 5
      start_period: 20s
    depends_on:
      eureka-server:
        condition: service_healthy
      config-service:
        condition: service_healthy

  product-service:
    image: ${DOCKER_REGISTRY}/product-service:latest
    build:
      context: ./product-service
      dockerfile: Dockerfile
    ports:
      - "9082:9082"
    environment:
      - EUREKA_URL=http://eureka-server:9761/eureka
      - DOCKER_CONFIG_SERVICE_URL=http://config-service:9888
      - DOCKER_MEDIA_SERVICE_URL=http://media-service:9083/api/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9082/actuator/health"]
      interval: 10s
      retries: 5
      start_period: 20s
    depends_on:
      eureka-server:
        condition: service_healthy
      config-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
      api-gateway:
        condition: service_healthy

  user-service:
    image: ${DOCKER_REGISTRY}/user-service:latest
    build:
      context: ./user-service
      dockerfile: Dockerfile
    ports:
      - "9081:9081"
    environment:
      - EUREKA_URL=http://eureka-server:9761/eureka
      - DOCKER_CONFIG_SERVICE_URL=http://config-service:9888
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9081/actuator/health"]
      interval: 10s
      retries: 5
      start_period: 20s
    depends_on:
      eureka-server:
        condition: service_healthy
      config-service:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      media-service:
        condition: service_healthy

  media-service:
    image: ${DOCKER_REGISTRY}/media-service:latest
    build:
      context: ./media-service
      dockerfile: Dockerfile
    ports:
      - "9083:9083"
    environment:
      - EUREKA_URL=http://eureka-server:9761/eureka
      - DOCKER_CONFIG_SERVICE_URL=http://config-service:9888
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9083/actuator/health"]
      interval: 10s
      retries: 5
      start_period: 60s
    depends_on:
      eureka-server:
        condition: service_healthy
      config-service:
        condition: service_healthy

  order-service:
    image: ${DOCKER_REGISTRY}/order-service:latest
    build:
      context: ./order-service
      dockerfile: Dockerfile
    ports:
      - "9084:9084"
    environment:
      - EUREKA_URL=http://eureka-server:9761/eureka
      - DOCKER_CONFIG_SERVICE_URL=http://config-service:9888
      - DOCKER_MEDIA_SERVICE_URL=http://media-service:9083/api/media
      - DOCKER_PRODUCT_SERVICE_URL=http://product-service:9082/api/products
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9084/actuator/health"]
      interval: 10s
      retries: 5
      start_period: 20s
    depends_on:
      eureka-server:
        condition: service_healthy
      config-service:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      product-service:
        condition: service_healthy
      media-service:
        condition: service_healthy

  frontend:
    image: ${DOCKER_REGISTRY}/buy-01-frontend:latest
    build:
      context: ./buy-01-frontend
      dockerfile: Dockerfile
    ports:
      - "4400:80"
      - "8444:443"
    depends_on:
      eureka-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
      config-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      order-service:
        condition: service_healthy